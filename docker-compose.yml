# Общие настройки Python-сервисов
x-python: &python
  build: .
  image: lab2-agents
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &env
    OLLAMA_URL: http://host.docker.internal:11434
    QDRANT_URL: http://qdrant:6333
    MCP_URL: http://mcp:8001/mcp
    REVIEWER_URL: http://reviewer:8002

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  mcp:
    <<: *python
    command: ["python", "cyberleninka_mcp.py"]
    environment:
      <<: *env
      MCP_PORT: "8001"
    ports:
      - "8001:8001"

  reviewer:
    <<: *python
    command: ["python", "reviewer_a2a.py"]
    environment:
      <<: *env
      A2A_PORT: "8002"
      A2A_PUBLIC_URL: http://reviewer:8002/
    ports:
      - "8002:8002"

  assistant:
    <<: *python
    restart: "no"
    profiles: ["cli"]
    entrypoint: ["python", "assistant.py"]
    command: []
    stdin_open: true
    tty: true
    environment:
      <<: *env
      MEMORY_DB: /data/memory.db
    volumes:
      - assistant_memory:/data
    depends_on:
      - qdrant
      - mcp
      - reviewer

volumes:
  qdrant_data:
    external: true
  assistant_memory:
